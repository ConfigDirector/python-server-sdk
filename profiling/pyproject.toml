[project]
name = "configdirector-profiling"
version = "0.0.0"
description = "Load-profiling harness for the ConfigDirector Python server SDK"
requires-python = ">=3.10"
dependencies = [
  # The app under test is samples/flask, imported in-process by server.py, so its runtime
  # dependencies have to be installed here too.
  "configdirector-server-sdk",
  "flask>=3.1",
  "python-dotenv>=1.0",
  # The harness itself.
  "httpx>=0.27",
  "psutil>=6.0",
]

[dependency-groups]
dev = ["mypy>=1.14", "types-psutil>=6.0"]

[tool.uv]
# A runnable tool, not a distributable package: install the dependencies, not this project.
package = false

[tool.uv.sources]
# Always profile the SDK in this repository rather than a published release.
configdirector-server-sdk = { path = "..", editable = true }

[tool.ruff]
# Inherit the SDK's style, but resolve first-party imports against this directory so that
# `configdirector` sorts as the third-party dependency it is here.
extend = "../pyproject.toml"
src = ["."]

[tool.mypy]
python_version = "3.10"
files = ["."]
strict = true
# The app under test is imported from samples/flask, which is not on mypy's path here. That
# sample is typechecked by `make samples`; this harness only needs its own code to be clean.
ignore_missing_imports = true
