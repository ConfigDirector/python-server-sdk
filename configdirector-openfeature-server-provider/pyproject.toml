[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "configdirector-openfeature-server-provider"
dynamic = ["version"]
description = "OpenFeature server provider for ConfigDirector. ConfigDirector is a remote configuration and feature flag service."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ConfigDirector" }]
keywords = [
  "configdirector",
  "openfeature server provider",
  "openfeature provider",
  "openfeature",
  "server",
  "provider",
  "config",
  "configuration",
  "remote config",
  "remote configuration",
  "feature flag",
  "feature toggle",
  "feature switch",
]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

dependencies = [
  "configdirector-server-sdk>=1.4,<2",
  "openfeature-sdk>=0.8.2,<1",
]

[project.urls]
Homepage = "https://www.configdirector.com"
Documentation = "https://docs.configdirector.com/sdks/openfeature/python"
Repository = "https://github.com/ConfigDirector/python-server-sdk"
Changelog = "https://github.com/ConfigDirector/python-server-sdk/blob/main/configdirector-openfeature-server-provider/CHANGELOG.md"
Support = "https://www.configdirector.com/support"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
]

[tool.uv.sources]
configdirector-server-sdk = { workspace = true }

[tool.hatch.version]
path = "src/configdirector_openfeature/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/configdirector_openfeature"]

[tool.hatch.build.targets.sdist]
include = ["src/configdirector_openfeature", "README.md", "LICENSE"]

[tool.ruff]
# Inherit the repository's style, but resolve first-party imports against this package so that
# `configdirector` sorts as the third-party dependency it is here.
extend = "../pyproject.toml"
src = ["src", "."]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --timeout=60 --timeout-method=thread"
xfail_strict = true

[tool.coverage.run]
source = ["src/configdirector_openfeature"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
