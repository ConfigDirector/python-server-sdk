[tool.uv.workspace]
members = ["configdirector-server-sdk", "configdirector-openfeature-server-provider"]
# Samples and the profiling harness are independent projects: they install the packages the way
# an application does, and must not resolve against this workspace just because they sit inside it.
exclude = ["samples/*/*", "profiling"]

# Only what runs from this directory. Each package declares the tools its own checks need, because
# `uv run` inside a package installs that package's groups and is not guaranteed to add these.
[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["configdirector-server-sdk/src", "configdirector-server-sdk"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "PT",   # flake8-pytest-style
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Test builders mirror the dataclass fields they construct, including `id` and `type`.
"*/tests/*" = ["S101", "A002"]

[tool.ruff.format]
quote-style = "double"
